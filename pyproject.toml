[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drt-dispatch-sim"
version = "0.2.0"
description = "실시간 수요응답형 합승 배차 엔진 시뮬레이터 — 분산 시스템 중심"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "h3==4.5.0",
    "numpy==2.4.6",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "structlog==26.1.0",
    "dash==4.2.0",
    "plotly==6.8.0",
    "dash-cytoscape==1.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "fakeredis==2.36.1", "ruff"]
redis = ["redis==8.0.0"]   # cluster 모드(실제 별도 프로세스) 전용

[project.scripts]
drt-sim = "drt_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
